function start(i){level=i;checked=false;responses={};if(i===0)round=[0,1,2];if(i===1)round=shuffle(DATA.havepool).slice(0,8);if(i===2){round=shuffle(DATA.base).slice(0,8);session.baseIds=round.map(x=>x.id)}if(i===3){let used=session.baseIds||[];round=shuffle(DATA.base.filter(x=>!used.includes(x.id))).slice(0,8)}if(i===4)round=shuffle(SIGNAL_PRACTICE).slice(0,8).map(x=>({...x,tiles:shuffle([...x.parts])}));if(i===5)round=shuffle(DATA.sincefor).slice(0,10);if(i===6)round=shuffle(DATA.boss).slice(0,8);render()}
function help(){let h=[`Das <b>Present Perfect</b> besteht aus <b>have/has + der 3. Verbform</b> (past participle). Damit sprichst du zum Beispiel über Erfahrungen: <i>I have visited a farm.</i> Ergänze die vier Lücken.`,`Bei <b>I, you, we, they</b> steht <b>have</b>; bei <b>he, she, it</b> steht <b>has</b>. Beispiel: <i>The farmer has a tractor</i> ist Simple Present; im Present Perfect heißt es <i>The farmer has driven a tractor.</i>`,`Setze das passende <b>have/has</b> und die <b>dritte Verbform</b> ein. Bei regelmäßigen Verben oft -ed: <i>visited</i>. Unregelmäßige Formen musst du kennen: <i>see → seen</i>. Beispiel: <i>We have seen a fox.</i>`,`Verneine mit <b>have not / has not + dritter Verbform</b>. Auch <b>haven't / hasn't</b> sowie <b>haven’t / hasn’t</b> sind richtig. Beispiel: <i>Mia hasn't ridden a horse.</i> Schreibe die vollständige Verneinung in das erste Feld und die dritte Verbform in das zweite Feld.`,`Wähle eines der vier Signalwörter: <b>ever · never · already · yet</b>. Baue einen grammatikalisch richtigen Satz. Manchmal sind mehrere Signalwörter richtig, aber nicht alle vier. Keine zusätzliche Kontexterklärung.`,`<b>Since</b> nennt den Beginn: <i>since 2020, since Monday, since I was five</i>. <b>For</b> nennt eine Dauer: <i>for two years, for an hour</i>.`,`In jedem Satz steckt <b>genau ein Grammatikfehler</b>. Schreibe nur das richtige Ersatzwort in das Feld. Beispiel: <i>She have seen a fox.</i> → <b>has</b>.`];return h[level]}
function render(){let l=LEVELS[level];app.innerHTML=`<div class="eyebrow">LEVEL ${level+1} / 7</div><h2>${l[0]}</h2><div class="panel"><div class="eyebrow">SO GEHT'S · DEUTSCHE ERKLÄRUNG</div><p>${help()}</p><button class="btn alt small" onclick="document.getElementById('hint').classList.toggle('hidden')">💡 Grammatikhilfe ein-/ausblenden</button><div id="hint" class="note hidden" style="margin-top:12px">Du kannst die Erklärung jederzeit erneut lesen. Bei der Auswertung zeigen wir dir auch die richtigen Lösungen.</div></div><div class="panel"><div class="eyebrow">YOUR CHALLENGE · ${l[2]} PUNKTE</div><p class="muted">${level===0?'Complete the rules.':level===1?'Choose have or has.':level===2?'Complete each sentence with have/has and the past participle.':level===3?'Write the negative present perfect.':level===4?'Choose the signal word, then put all words in the correct order.':level===5?'Choose since or for.':'Find the mistake. Write the correct word.'}</p><div id="tasks"></div><div class="actions"><button class="btn" onclick="check()">✓ Check answers</button><button class="btn alt" onclick="start(level)">↻ Neue Runde</button><button class="btn alt" onclick="home()">⌂ Menü</button></div><div id="feedback"></div></div>`;drawTasks()}
function inp(i,k,cls=''){return `<input class="inline ${cls}" id="f${i}_${k}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Lücke ${k+1} in Satz ${i+1}" value="${esc((responses[i]||{})[k]||'')}" oninput="put(${i},${k},this.value)">`}
function put(i,k,v){responses[i]??={};responses[i][k]=v;if(level===4&&k===0)responses[i][1]=[];checked=false;document.getElementById('feedback').innerHTML=''}
function choice(i,k,v){responses[i]??={};responses[i][k]=v;if(level===4&&k===0)responses[i][1]=[];checked=false;drawTasks();document.getElementById('feedback').innerHTML=''}
function selectHTML(i,k,options){return `<select aria-label="Antwort ${i+1}" onchange="choice(${i},${k},this.value)"><option value="">Bitte wählen</option>${options.map(v=>`<option value="${esc(v)}" ${responses[i]?.[k]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`}
function drawTasks(){document.getElementById('tasks').innerHTML=round.map((q,i)=>{let content='';if(level===0){let rules=[`Das Present Perfect besteht aus <b>have</b> oder ${selectHTML(i,0,['has','had','is','does'])} und aus der dritten Form des ${selectHTML(i,1,['Verbs','Adjektivs','Substantivs','Satzes'])}.`,`Mit dem Present Perfect sagst du, dass etwas irgendwann einmal oder mehrmals ${selectHTML(i,0,['passiert ist','passieren wird','gerade passiert','jeden Tag passiert'])}.`,`Du kannst auch sagen, dass etwas noch ${selectHTML(i,0,['nie','immer','gestern','morgen'])} passiert ist.`];if(i===3)return '';content=rules[i]}else if(level===1)content=`<div class="sentence">${esc(q.sub)} ${selectHTML(i,0,['have','has'])} ${esc(q.pp)} ${esc(q.obj)}.</div>`;else if(level===2)content=`<div class="sentence">${esc(q.sub)} ${inp(i,0)} ${inp(i,1,'long')} ${esc(q.obj)}. <span class="muted">(${esc(q.verb)})</span></div>`;else if(level===3)content=`<div class="sentence">${esc(q.sub)} ${inp(i,0,'long')} ${inp(i,1,'long')} ${esc(q.obj)}. <span class="muted">(${esc(q.verb)})</span></div><small class="muted">have not · has not · haven't · hasn't · haven’t · hasn’t: erste Lücke = Verneinung, zweite Lücke = dritte Verbform.</small>`;else if(level===4){let chosen=responses[i]?.[0]||'';let placed=responses[i]?.[1]||[];let available=[...q.tiles,...(chosen?[chosen]:[])];content=`<p><b>1. Choose the signal word:</b> ${selectHTML(i,0,['ever','never','already','yet'])}</p><p><b>2. Put the words in order:</b></p><div class="slot">${placed.map((w,j)=>`<button class="tile placed" onclick="removeTile(${i},${j})">${esc(w)} ×</button>`).join('')||'<span class="muted">Tippe unten auf die Wörter …</span>'}</div><div>${available.map((w,j)=>placed.filter(x=>x===w).length<available.filter(x=>x===w).length?`<button class="tile" onclick="addTile(${i},${j})">${esc(w)}</button>`:'').join('')}</div>`}else if(level===5)content=`<div class="sentence">${esc(q[0])} ${selectHTML(i,0,['since','for'])} ${esc(q[1])}.</div>`;else content=`<div class="sentence">${esc(q[0])}</div><label>Correct word: ${inp(i,0,'long')}</label>`;return `<div class="task"><div class="eyebrow">${i+1} / ${round.length}</div>${content}</div>`}).join('')}
function addTile(i,j){let q=round[i],r=responses[i]||{},arr=[...q.tiles,...(r[0]?[r[0]]:[])],placed=r[1]||[];if(placed.filter(x=>x===arr[j]).length>=arr.filter(x=>x===arr[j]).length)return;responses[i]={...r,1:[...placed,arr[j]]};drawTasks()}
function removeTile(i,j){let r=responses[i];responses[i]={...r,1:r[1].filter((_,k)=>k!==j)};drawTasks()}
function isParticiple(input,correct,verb){let a=norm(input),b=norm(correct);if(a===b)return true;if(!progress.lrs||!a||a.length<3)return false;if(a===norm(verb))return false;let irregular={go:['went','goed'],see:['saw','seed'],ride:['rode','rided'],eat:['ate','eated'],write:['wrote','writed'],drive:['drove','drived'],take:['took','taked'],give:['gave','gived'],break:['broke','breaked'],buy:['buyed'],find:['finded'],make:['maked'],drink:['drank','drinked'],grow:['grew','growed'],choose:['chose','choosed'],catch:['catched'],bring:['bringed'],build:['builded'],meet:['meeted'],lose:['losed'],feed:['feeded']};if((irregular[verb]||[]).includes(a))return false;let d=Array.from({length:a.length+1},(_,i)=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]!==b[j-1]));return d[a.length][b.length]===1}
function scoreOne(q,i){let r=responses[i]||{},a=k=>norm(r[k]);if(level===0){if(i===0)return .5*(a(0)==='has')+.5*(a(1)==='verbs');if(i===1)return .5*(a(0)==='passiert ist');if(i===2)return .5*(a(0)==='nie');return 0}if(level===1)return a(0)===q.aux?.5:0;if(level===2)return (a(0)===q.aux?.5:0)+(isParticiple(r[1],q.pp,q.verb)?1:0);if(level===3){let negative=a(0);let valid=negative===q.aux+' not'||negative===(q.aux==='has'?"hasn't":"haven't");return (valid?.5:0)+(isParticiple(r[1],q.pp,q.verb)?1:0)}if(level===4){let seq=r[1]||[],signal=a(0),valid=q.accepted.includes(signal);let target=signalTarget(q,signal);let orderCorrect=valid&&seq.length===target.length&&seq.every((w,j)=>norm(w)===norm(target[j]));return (valid?.5:0)+(orderCorrect?1:0)}if(level===5)return a(0)===q[2]?.5:0;if(level===6)return nearWord(r[0],q[2])?1:0;return 0}
function solution(q,i){if(level===0)return ['has; Verbs','passiert ist','nie'][i]||'';if(level===1)return `${q.sub} ${q.aux} ${q.pp} ${q.obj}.`;if(level===2)return `${q.sub} ${q.aux} ${q.pp} ${q.obj}.`;if(level===3)return `${q.sub} ${q.aux} not ${q.pp} ${q.obj}.`;if(level===4){return q.accepted.map(w=>{let a=signalTarget(q,w);return a.join(' ')+(a[0]==='Has'||a[0]==='Have'?'?':'.')}).join(' / ')}if(level===5)return `${q[0]} ${q[2]} ${q[1]}.`;return `${q[1]} → ${q[2]}`}
function check(){if(level===0){let x=document.querySelectorAll('#tasks select');x.forEach(el=>{let m=el.getAttribute('onchange').match(/choice\((\d+),(\d+)/);if(m){responses[+m[1]]??={};responses[+m[1]][+m[2]]=el.value}})}else if([1,5].includes(level)){document.querySelectorAll('#tasks select').forEach(el=>{let m=el.getAttribute('onchange').match(/choice\((\d+),(\d+)/);if(m){responses[+m[1]]??={};responses[+m[1]][+m[2]]=el.value}})}else if([2,3,6].includes(level)){document.querySelectorAll('#tasks input').forEach(el=>{let m=el.id.match(/f(\d+)_(\d+)/);if(m){responses[+m[1]]??={};responses[+m[1]][+m[2]]=el.value}})}let values=round.map(scoreOne),best=[2,3,4].includes(level)?[...values].sort((a,b)=>b-a).slice(0,6):values;let total=Math.round(best.reduce((a,b)=>a+b,0)*100)/100;let max=LEVELS[level][2];progress[level]=Math.max(progress[level]||0,total);save();checked=true;beep(total/max>=.7);let feedback=round.map((q,i)=>`<div class="task"><span class="${values[i]===([0,1,5,6].includes(level)?(level===0?(i===0?1:.5):level===1||level===5?.5:1):1.5)?'correct':'wrong'}">${values[i]} P.</span> <span class="muted">${i+1}. ${esc(solution(q,i))}</span></div>`).join('');document.getElementById('feedback').innerHTML=`<div class="note"><div class="eyebrow">ROUND COMPLETE</div><div class="score">${total} / ${max}</div>${[2,3,4].includes(level)?'Die sechs besten Sätze wurden gewertet.':'Alle Aufgaben wurden gewertet.'}<p>Du kannst eine neue Zufallsrunde starten oder zum nächsten Level gehen.</p></div><details><summary style="padding:15px;cursor:pointer">Lösungen und Einzelpunkte anzeigen</summary>${feedback}</details><div class="actions"><button class="btn" onclick="${level<6?'start('+(level+1)+')':'results()'}">${level<6?'Nächstes Level →':'Gesamtauswertung →'}</button><button class="btn alt" onclick="start(level)">↻ Nochmal üben</button><button class="btn alt" onclick="home()">⌂ Menü</button></div>`;document.getElementById('feedback').scrollIntoView({behavior:'smooth',block:'nearest'})}
function results(){level=-1;let sum=LEVELS.reduce((a,l,i)=>a+(progress[i]||0),0),done=LEVELS.filter((_,i)=>progress[i]!=null).length,pct=sum/MAX*100,g=grade(pct);app.innerHTML=`<div class="eyebrow">YOUR RESULTS</div><h1>QUEST <span style="color:var(--cyan)">COMPLETE?</span></h1><div class="panel"><p>Deine bisher besten Ergebnisse aus allen sieben Levels:</p><div class="score">${sum} / ${MAX}</div><h2>${pct.toFixed(1).replace('.',',')} % · Note ${g}</h2><div class="bar"><div style="width:${pct}%"></div></div><p class="note"><b>Das wäre deine Note!</b> Es ist eine Übung, keine Klassenarbeit. ${done<7?'Du hast erst '+done+' von 7 Levels abgeschlossen. Die Note ist deshalb noch nicht aussagekräftig.':'Du hast alle Levels mindestens einmal bearbeitet.'}</p><div class="grid">${LEVELS.map((l,i)=>`<div class="task"><b>${i+1}. ${l[0]}</b><p>${progress[i]??'–'} / ${l[2]} P.</p></div>`).join('')}</div><p class="muted">Notenschlüssel ohne Rundung: 1 ab 91 %, 2 ab 81 %, 3 ab 66 %, 4 ab 50 %, 5 ab 26 %, sonst 6.</p><div class="actions"><button class="btn" onclick="home()">Zurück zum Menü</button></div></div>`}
home();
</script></body></html>
