function score(l,x,i){let a=S.answers[l]?.[i]||{};if(l===0){let keys=i===0?['has','Verbs']:i===1?['passiert ist']:['nie'];return keys.reduce((v,k,j)=>v+(norm(a[j])===norm(k)?.5:0),0)}if(l===1)return norm(a[0])===x.aux?.5:0;
if(l===2)return (norm(a[0])===x.aux?.5:0)+(near(a[1],x.pp)?1:0);
if(l===3){let n=norm(a[0]).replace(/’/g,"'");let valid=x.aux==='has'?['has not',"hasn't"]:['have not',"haven't"];return (valid.includes(n)?.5:0)+(near(a[1],x.pp)?1:0)}
if(l===4){let chosen=norm(a[0])===x.signal?.5:0;let target=[...x.parts];target.splice(x.position,0,x.signal);let order=a.order||[];return chosen+(chosen>0&&norm(order.join(' '))===norm(target.join(' '))?1:0)}
if(l===5)return norm(a[0])===x[2]?.5:0;
return near(a[0],x[2])?1:0}
function compute(){let scores=[],details=[];for(let l=0;l<7;l++){let vals=S.pools[l].map((x,i)=>score(l,x,i));let kept=(l===2||l===3)?[...vals].sort((a,b)=>b-a).slice(0,6):vals;scores.push(kept.reduce((a,b)=>a+b,0));details.push(vals)}return {scores,details,total:scores.reduce((a,b)=>a+b,0)}}
function submitExam(){if(!confirm('Wirklich endgültig abgeben? Danach kannst du nichts mehr ändern.'))return;S.submitted=true;S.submittedAt=new Date().toISOString();S.result=compute();S.checkToken=secureToken();save();result();if(!S.demo)uploadExam()}
function downloadJpeg(){try{const a=document.createElement('a');a.href=correctionJpeg();a.download=`PresentPerfect_Korrektur_${S.year}${S.letter}_${S.id}.jpg`;document.body.appendChild(a);a.click();a.remove()}catch(e){alert('JPEG konnte nicht erstellt werden: '+e.message)}}
function secureToken(){let a=new Uint8Array(24);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')}
function reportRows(){let rows=[];for(let l=0;l<7;l++)S.pools[l].forEach((x,i)=>{let a=S.answers[l]?.[i]||{};let correct='',given='';if(l===0){let keys=i===0?['has','Verbs']:i===1?['passiert ist']:['nie'];correct=keys.join(' / ');given=keys.map((_,j)=>a[j]||'—').join(' / ')}else if(l===1){correct=x.aux;given=a[0]||'—'}else if(l===2){correct=x.aux+' '+x.pp;given=(a[0]||'—')+' '+(a[1]||'—')}else if(l===3){correct=x.aux+' not '+x.pp;given=(a[0]||'—')+' '+(a[1]||'—')}else if(l===4){let target=[...x.parts];target.splice(x.position,0,x.signal);correct=target.join(' ');given='Signalwort: '+(a[0]||'—')+' | '+(a.order||[]).join(' ')}else if(l===5){correct=x[2];given=a[0]||'—'}else{correct=x[2];given=a[0]||'—'}rows.push({level:l+1,index:i+1,question:l===0?'Present Perfect – Regel':l===1?x.sub+' … '+x.pp+' '+x.obj:l===2||l===3?x.sub+' … '+x.obj:l===4?x.context:l===5?x[0]+' … '+x[1]:x[0],answer:given,solution:correct,points:S.result.details[l][i],max:l===0?(i===0?1:.5):l===1||l===5?.5:l===4?1.5:l===6?1:1.5})});return rows}
function correctionJpeg(){const rows=reportRows(),c=document.createElement('canvas');c.width=1500;c.height=340+rows.length*115;let ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#142c3d';ctx.fillRect(0,0,c.width,210);ctx.fillStyle='#fff';ctx.font='bold 47px Arial';ctx.fillText('PRESENT PERFECT · CORRECTION',45,80);ctx.font='27px Arial';ctx.fillText(`${S.name} ${S.surname} · ${S.year}${S.letter.toLowerCase()} · ${S.submittedAt||''}`,45,132);ctx.fillText(`${S.result.total} / 49 Punkte · Note ${grade(S.result.total)} (vorläufig) · LRS ${S.lrs?'Ja':'Nein'}`,45,175);let y=250;for(const row of rows){ctx.fillStyle=row.index%2?'#f0f4f8':'#fff';ctx.fillRect(25,y-30,1450,112);ctx.fillStyle='#172b41';ctx.font='bold 22px Arial';ctx.fillText(`${row.level}.${row.index} ${row.question}`.slice(0,112),40,y);ctx.font='21px Arial';ctx.fillStyle='#a32935';ctx.fillText('Antwort: '+row.answer.slice(0,115),42,y+32);ctx.fillStyle='#18744e';ctx.fillText('Lösung: '+row.solution.slice(0,105),42,y+60);ctx.fillStyle='#172b41';ctx.fillText(`${row.points} P.`,1370,y+32);y+=115}ctx.font='bold 23px Arial';ctx.fillStyle='#9b2635';ctx.fillText('VORLÄUFIG – Endgültige Bewertung erst nach Prüfung durch die Lehrkraft.',45,c.height-38);return c.toDataURL('image/jpeg',.83)}
function uploadPayload(){const name=(S.name||'')+' '+(S.surname||'');return {attemptId:S.id,checkToken:S.checkToken,klasse:S.year+S.letter.toLowerCase(),test:'Present Perfect | Country Life vs. City Life',kuerzel:S.name.slice(0,3)+S.surname.slice(0,4),anzeigeName:name,punkte:S.result.total,maxPunkte:TOTAL,note:grade(S.result.total),lrs:S.lrs,verlassen:S.events.hidden||0,split:S.events.blur||0,details:reportRows(),jpeg:correctionJpeg()}}
function statusBox(text,ok){let el=document.getElementById('uploadBox');if(!el)return;el.style.background=ok?'#174d3c':'#8b1725';el.style.color='#fff';el.style.padding='22px';el.style.borderRadius='14px';el.style.marginTop='20px';el.innerHTML=text}
function checkRemote(){return new Promise(resolve=>{let callback='ppStatus_'+Math.random().toString(36).slice(2,15),done=false;const sc=document.createElement('script');const timer=setTimeout(()=>finish(false),9000);function finish(v){if(done)return;done=true;clearTimeout(timer);delete window[callback];sc.remove();resolve(v)}window[callback]=r=>finish(!!r&&r.id===S.id&&r.success===true);sc.onerror=()=>finish(false);sc.src=ENDPOINT+'?callback='+callback+'&id='+encodeURIComponent(S.id)+'&token='+encodeURIComponent(S.checkToken)+'&_='+Date.now();document.head.appendChild(sc)})}
let uploadBusy=false;
async function uploadExam(){if(!S?.submitted||S.demo||S.uploadConfirmed||uploadBusy)return;uploadBusy=true;statusBox('<b>⏳ Speicherung läuft …</b><br>Bitte diese Seite geöffnet lassen.',false);try{if(!navigator.onLine)throw new Error('Keine Internetverbindung');const existing=await checkRemote();if(existing){S.uploadConfirmed=true;save();statusBox('<b>✅ DEINE KLASSENARBEIT WURDE ERFOLGREICH GESPEICHERT!</b><br>Google Sheets und das Korrekturbild in Drive sind bestätigt.',true);return}await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(uploadPayload())});let success=false;for(let n=0;n<5;n++){await new Promise(r=>setTimeout(r,1300+n*800));if(await checkRemote()){success=true;break}}if(!success)throw new Error('Keine bestätigte Speicherung');S.uploadConfirmed=true;save();statusBox('<b>✅ DEINE KLASSENARBEIT WURDE ERFOLGREICH GESPEICHERT!</b><br>Google Sheets und das Korrekturbild in Drive sind bestätigt.',true)}catch(err){statusBox('<b>🚨 ACHTUNG! DEINE KLASSENARBEIT WURDE NOCH NICHT ERFOLGREICH GESPEICHERT!</b><br>Informiere sofort deine Lehrkraft. Prüfe das WLAN und drücke auf den Button.<br><br><button onclick="uploadExam()">🔄 SPEICHERUNG ERNEUT VERSUCHEN</button><br><small>Die abgegebene Arbeit bleibt auf diesem Gerät gesperrt und lokal gespeichert, solange die Browserdaten erhalten bleiben.</small>',false)}finally{uploadBusy=false}}
function result(){let r=S.result||compute();app.innerHTML=`<h1>🎉 Test abgeschlossen</h1><div class="card"><h2>${escapeHTML(S.name)} ${escapeHTML(S.surname)} · ${S.year}${S.letter.toLowerCase()}</h2><h1>${r.total} / ${TOTAL} Punkte</h1><h2>${(100*r.total/TOTAL).toFixed(2).replace('.',',')} % · Note ${grade(r.total)}</h2><div class="warn"><strong>WICHTIG: DIESE NOTE IST NUR VORLÄUFIG!</strong><br>Die Lehrkraft muss das Ergebnis noch überprüfen. Erst danach steht die endgültige Note fest.</div>${TITLES.map((t,i)=>`<p>${i+1}. ${t}: <b>${r.scores[i]} / ${MAX[i]}</b></p>`).join('')}<div id="uploadBox"></div><h2>Deine Fehler und Lösungen</h2><p>Alle Antworten werden angezeigt. Die automatische Korrektur kann von der Lehrkraft angepasst werden.</p>${reportRows().map(z=>`<div class="task"><b>${z.level}.${z.index} · ${escapeHTML(z.question)}</b><br>Deine Antwort: ${escapeHTML(z.answer)}<br>Richtige Lösung: <b>${escapeHTML(z.solution)}</b> · ${z.points} Punkte</div>`).join('')}<button onclick="downloadJpeg()">⬇ Korrektur als JPEG herunterladen</button></div>`;if(S.demo)statusBox('Lehrer-Demo: keine Google-Speicherung.',true);else if(S.uploadConfirmed)statusBox('<b>✅ DEINE KLASSENARBEIT WURDE ERFOLGREICH GESPEICHERT!</b>',true);else{statusBox('<b>🚨 Speicherung noch nicht bestätigt!</b><br><button onclick="uploadExam()">🔄 SPEICHERUNG ERNEUT VERSUCHEN</button>',false)}}
document.addEventListener('visibilitychange',()=>{if(S?.started&&!S.submitted&&document.hidden){S.events.hidden++;save()}});window.addEventListener('blur',()=>{if(S?.started&&!S.submitted){S.events.blur++;save()}});
if(S?.submitted){result();if(!S.demo&&!S.uploadConfirmed)uploadExam();}else if(S?.started)render();else welcome();
</script></main></body></html>
