 if(l===0){let keys=i===0?['has','Verbs']:i===1?['passiert ist']:['nie'];correct=keys.join(' / ');given=keys.map((_,j)=>a[j]||'—').join(' / ')}

 else if(l===2){correct=(x.negative?x.aux+' not':x.aux)+' '+x.pp;given=(a[0]||'—')+' '+(a[1]||'—')}
 else if(l===3){correct='never / already | '+[...x.parts.slice(0,x.position),'never / already',...x.parts.slice(x.position)].join(' ');given='Signal: '+(a[0]||'—')+' | '+(a.order||[]).join(' ')}
 else if(l===4){correct=x[2];given=a[0]||'—'}else{correct=x[2];given=a[0]||'—'}
 let max=l===0?(i===0?1:.5):l===1||l===4?.5:l===3?1.5: l===5?1:1.5;
 let counted=S.result.counted?.[l]?.includes(i)??true;
 rows.push({level:l+1,index:i+1,question:l===0?'Present Perfect – Regel':l===1?x.sub+' … '+x.pp+' '+x.obj:l===2?x.sub+' … '+x.obj:l===3?x.parts.join(' '):l===4?x[0]+' … '+x[1]:x[0],answer:given,solution:correct,points:S.result.details[l][i],max,counted,wrong:counted&&S.result.details[l][i]<max});
 });return rows}
function correctionJpeg(){
 const rows=reportRows().filter(x=>x.wrong),c=document.createElement('canvas');
 c.width=1500;c.height=710+Math.max(1,rows.length)*125;
 const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
 ctx.fillStyle='#142c3d';ctx.fillRect(0,0,c.width,210);ctx.fillStyle='#fff';
 ctx.font='bold 45px Arial';ctx.fillText('PRESENT PERFECT · FEHLERKORREKTUR',45,78);
 ctx.font='26px Arial';ctx.fillText(`${S.name} ${S.surname} · ${S.year}${S.letter.toLowerCase()} · ${S.submittedAt||''}`,45,130);
 ctx.font='bold 29px Arial';ctx.fillText(`${S.result.total} / ${TOTAL} Punkte · Note ${grade(S.result.total)} (vorläufig) · LRS ${S.lrs?'Ja':'Nein'}`,45,177);
 let y=253;ctx.fillStyle='#172b41';ctx.font='bold 25px Arial';ctx.fillText('PUNKTE NACH AUFGABEN',45,y);y+=39;
 ctx.font='21px Arial';
 TITLES.forEach((t,i)=>{ctx.fillStyle=i%2?'#f2f5f9':'#fff';ctx.fillRect(35,y-25,1410,34);ctx.fillStyle='#172b41';ctx.fillText(`${i+1}. ${t}`,48,y);ctx.font='bold 21px Arial';ctx.fillText(`${S.result.scores[i]} / ${MAX[i]} Punkte`,1150,y);ctx.font='21px Arial';y+=37});
 y+=22;ctx.fillStyle='#172b41';ctx.font='bold 25px Arial';ctx.fillText('NOTENSCHLÜSSEL (40 PUNKTE)',45,y);y+=35;
 const boundaries=[Math.ceil(TOTAL*.91),Math.ceil(TOTAL*.81),Math.ceil(TOTAL*.66),Math.ceil(TOTAL*.50),Math.ceil(TOTAL*.26),0];
 const grades=boundaries.map((min,i)=>`Note ${i+1}: ${min}–${i===0?TOTAL:boundaries[i-1]-1} P. (${GRADE_KEY[i][1]})`);
 ctx.font='19px Arial';ctx.fillStyle='#172b41';
 ctx.fillText(grades.slice(0,3).join('     |     '),45,y);y+=31;
 ctx.fillText(grades.slice(3).join('     |     '),45,y);y+=57;
 ctx.font='bold 25px Arial';ctx.fillText('FEHLER UND RICHTIGE LÖSUNGEN',45,y);y+=49;
 for(const row of rows){ctx.fillStyle='#fff0f0';ctx.fillRect(25,y-30,1450,119);ctx.fillStyle='#172b41';ctx.font='bold 22px Arial';ctx.fillText(`${row.level}.${row.index} ${row.question}`.slice(0,105),40,y);ctx.font='bold 22px Arial';ctx.fillStyle='#b00020';ctx.fillText('FEHLER: '+row.answer.slice(0,105),42,y+35);ctx.fillStyle='#087a47';ctx.fillText('RICHTIG: '+row.solution.slice(0,105),42,y+68);ctx.fillStyle='#b00020';ctx.fillText(`${row.points}/${row.max} P.`,1340,y+35);y+=125}
 if(!rows.length){ctx.fillStyle='#087a47';ctx.font='bold 27px Arial';ctx.fillText('Keine Fehler in den gewerteten Antworten!',45,y)}
 ctx.font='bold 20px Arial';ctx.fillStyle='#9b2635';ctx.fillText('VORLÄUFIG – Endgültige Bewertung durch die Lehrkraft.',45,c.height-32);
 return c.toDataURL('image/jpeg',.83)
}
function uploadPayload(){const name=(S.name||'')+' '+(S.surname||'');return {attemptId:S.id,checkToken:S.checkToken,klasse:S.year+S.letter.toLowerCase(),test:'Present Perfect | Country Life vs. City Life',kuerzel:S.name.slice(0,3)+S.surname.slice(0,4),anzeigeName:name,punkte:S.result.total,maxPunkte:TOTAL,note:grade(S.result.total),lrs:S.lrs,verlassen:S.events.hidden||0,split:S.events.blur||0,details:reportRows(),jpeg:correctionJpeg()}}
function statusBox(text,ok){let el=document.getElementById('uploadBox');if(!el)return;el.style.background=ok?'#174d3c':'#8b1725';el.style.color='#fff';el.style.padding='22px';el.style.borderRadius='14px';el.style.marginTop='20px';el.innerHTML=text}
function checkRemote(){return new Promise(resolve=>{let callback='ppStatus_'+Math.random().toString(36).slice(2,15),done=false;const sc=document.createElement('script');const timer=setTimeout(()=>finish(false),9000);function finish(v){if(done)return;done=true;clearTimeout(timer);delete window[callback];sc.remove();resolve(v)}window[callback]=r=>finish(!!r&&r.id===S.id&&r.success===true);sc.onerror=()=>finish(false);sc.src=ENDPOINT+'?callback='+callback+'&id='+encodeURIComponent(S.id)+'&token='+encodeURIComponent(S.checkToken)+'&_='+Date.now();document.head.appendChild(sc)})}
let uploadBusy=false;
async function uploadExam(){if(!S?.submitted||S.demo||S.uploadConfirmed||uploadBusy)return;uploadBusy=true;statusBox('<b>⏳ Speicherung läuft …</b><br>Bitte diese Seite geöffnet lassen.',false);try{if(!navigator.onLine)throw new Error('Keine Internetverbindung');const existing=await checkRemote();if(existing){S.uploadConfirmed=true;save();statusBox('<b>✅ DEINE TEST WURDE ERFOLGREICH GESPEICHERT!</b><br>Google Sheets und das Korrekturbild in Drive sind bestätigt.',true);return}await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(uploadPayload())});let success=false;for(let n=0;n<5;n++){await new Promise(r=>setTimeout(r,1300+n*800));if(await checkRemote()){success=true;break}}if(!success)throw new Error('Keine bestätigte Speicherung');S.uploadConfirmed=true;save();statusBox('<b>✅ DEINE TEST WURDE ERFOLGREICH GESPEICHERT!</b><br>Google Sheets und das Korrekturbild in Drive sind bestätigt.',true)}catch(err){statusBox('<b>🚨 ACHTUNG! DEINE TEST WURDE NOCH NICHT ERFOLGREICH GESPEICHERT!</b><br>Informiere sofort deine Lehrkraft. Prüfe das WLAN und drücke auf den Button.<br><br><button onclick="uploadExam()">🔄 SPEICHERUNG ERNEUT VERSUCHEN</button><br><small>Die abgegebene Arbeit bleibt auf diesem Gerät gesperrt und lokal gespeichert, solange die Browserdaten erhalten bleiben.</small>',false)}finally{uploadBusy=false}}
function result(){let r=S.result||compute(),errors=reportRows().filter(z=>z.wrong);
 app.innerHTML=`<h1>🎉 Test abgeschlossen</h1><div class="card"><h2>${escapeHTML(S.name)} ${escapeHTML(S.surname)} · ${S.year}${S.letter.toLowerCase()}</h2><h1>${r.total} / ${TOTAL} Punkte</h1><h2>${(100*r.total/TOTAL).toFixed(2).replace('.',',')} % · Note ${grade(r.total)}</h2><div class="warn"><strong>WICHTIG: DIESE NOTE IST NUR VORLÄUFIG!</strong><br>Die Lehrkraft muss das Ergebnis noch überprüfen.</div>${TITLES.map((t,i)=>`<p>${i+1}. ${t}: <b>${r.scores[i]} / ${MAX[i]}</b></p>`).join('')}<h2>Notenschlüssel</h2><p>${GRADE_KEY.map(x=>`<span class="tag">Note ${x[0]}: ${x[1]}</span>`).join('')}</p><div id="uploadBox"></div><h2>Deine Fehler und Lösungen</h2><p>Es werden nur Fehler in den gewerteten Antworten angezeigt. Bei den Wahlaufgaben zählen die besten Ergebnisse.</p>${errors.length?errors.map(z=>`<div class="task" style="background:#3c2434;border-left:6px solid #ff5968;padding:12px;margin:9px 0;border-radius:8px"><b>${z.level}.${z.index} · ${escapeHTML(z.question)}</b><br><strong style="color:#ff9da4">❌ Deine Antwort: ${escapeHTML(z.answer)}</strong><br><strong style="color:#8ff6bc">✓ Richtige Lösung: ${escapeHTML(z.solution)}</strong> · ${z.points}/${z.max} Punkte</div>`).join(''):'<p class="good">🎉 Keine Fehler in den gewerteten Antworten!</p>'}<button onclick="downloadJpeg()">⬇ Fehlerkorrektur als JPEG herunterladen</button><div style="margin-top:22px;border-top:1px solid #394766;padding-top:16px"><button onclick="reset()">🔐 Neuen Test starten – Lehrerfreigabe</button></div></div>`;
 if(S.demo)statusBox('Lehrer-Demo: keine Google-Speicherung.',true);else if(S.uploadConfirmed)statusBox('<b>✅ DEINE TEST WURDE ERFOLGREICH GESPEICHERT!</b>',true);else statusBox('<b>🚨 Speicherung noch nicht bestätigt!</b><br><button onclick="uploadExam()">🔄 SPEICHERUNG ERNEUT VERSUCHEN</button>',false);
}
document.addEventListener('visibilitychange',()=>{if(S?.started&&!S.submitted&&document.hidden){S.events.hidden++;save()}});window.addEventListener('blur',()=>{if(S?.started&&!S.submitted){S.events.blur++;save()}});
if(S?.submitted){result();if(!S.demo&&!S.uploadConfirmed)uploadExam();}else if(S?.started)render();else welcome();
